<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>传感器监测台 · 声·磁·振</title>
<style>
:root{
  --bg:#0B1015;
  --panel:#111A22;
  --panel2:#0E161D;
  --line:#1E2A35;
  --text:#E6EDF3;
  --muted:#7B8A99;
  --cyan:#22D3EE;
  --green:#34D399;
  --amber:#F5A623;
  --red:#EF4444;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--text);font-family:var(--sans);-webkit-text-size-adjust:100%}
body{padding:0 0 48px}
#wrap{max-width:720px;margin:0 auto;padding:0 14px}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;touch-action:manipulation}
button:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
/* ===== 顶栏 ===== */
header{padding:14px 0 10px;display:flex;align-items:center;justify-content:space-between;gap:8px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px}
.brand svg{flex:0 0 auto}
.brand h1{font-size:15px;font-weight:700;letter-spacing:.5px;line-height:1.2}
.brand .sub{font-size:11px;color:var(--muted);font-family:var(--mono)}
.pill{font-size:10px;font-family:var(--mono);padding:4px 8px;border-radius:20px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill.on{color:var(--green);border-color:rgba(52,211,153,.5);background:rgba(52,211,153,.08)}
/* ===== 状态条 ===== */
.ctx{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 4px}
.ctx .tag{font-size:10px;font-family:var(--mono);padding:3px 8px;border-radius:4px;border:1px solid var(--line);color:var(--muted)}
.ctx .tag.good{color:var(--green);border-color:rgba(52,211,153,.4)}
.ctx .tag.bad{color:var(--red);border-color:rgba(239,68,68,.4)}
.ctx .tag.ask{color:var(--amber);border-color:rgba(245,166,35,.4)}
/* ===== 仪表卡 ===== */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 10px 10px;min-width:0}
.card .h{display:flex;justify-content:space-between;align-items:center;gap:6px}
.card .h .nm{font-size:11px;color:var(--muted);font-weight:600}
.card .h .dot{width:8px;height:8px;border-radius:50%;background:var(--line)}
.card .h .dot.live{background:var(--green);box-shadow:0 0 6px rgba(52,211,153,.7);animation:pulse 1.6s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.gauge{position:relative;display:block;margin:2px auto 0;width:100%;max-width:210px}
.gauge canvas{display:block;width:100%;height:auto}
.gvalue{text-align:center;margin-top:-2px}
.gvalue .v{font-family:var(--mono);font-weight:700;font-size:30px;line-height:1;color:var(--text);font-variant-numeric:tabular-nums}
.gvalue .u{font-size:11px;color:var(--muted);margin-left:2px}
.gstate{text-align:center;font-size:10px;color:var(--muted);margin-top:3px;min-height:14px}
.gstate.warn{color:var(--amber)}
.gstate.alarm{color:var(--red);font-weight:600}
.compass-read{text-align:center;font-family:var(--mono);font-size:13px;margin-top:6px;color:var(--text)}
.compass-read .hd{color:var(--muted);font-size:10px;margin-right:4px}
.vibval{display:flex;justify-content:space-between;margin-top:6px;gap:6px}
.vibval .col{flex:1;text-align:center}
.vibval .col .n{font-family:var(--mono);font-size:15px;font-weight:700;font-variant-numeric:tabular-nums}
.vibval .col .l{font-size:9px;color:var(--muted);margin-top:2px}
/* ===== 波形 ===== */
.wave{margin-top:6px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:5px}
.wave .w-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:3px}
.wave .w-h .nm{font-size:11px;color:var(--muted);font-weight:600}
.wave .w-h .live-db{font-family:var(--mono);font-size:12px;font-weight:700;font-variant-numeric:tabular-nums}
canvas#scope{display:block;width:100%;height:50px;background:#080C10;border-radius:8px;border:1px solid var(--line)}
/* ===== 日志区 ===== */
.zone{margin-top:12px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px}
.zone .z-h{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:8px}
.zone .z-h .nm{font-size:13px;font-weight:700}
.zone .z-h .cnt{font-family:var(--mono);font-size:12px;color:var(--muted)}
.set{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 0;border-top:1px dashed var(--line);border-bottom:1px dashed var(--line)}
.set label{font-size:11px;color:var(--muted)}
.set input[type=range]{flex:1;min-width:120px;accent-color:var(--cyan);height:26px}
.set .thv{font-family:var(--mono);font-weight:700;color:var(--amber);font-size:14px}
.btns{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.btn{flex:1;min-height:44px;border-radius:9px;font-size:13px;font-weight:600;border:1px solid var(--line);background:var(--panel2);color:var(--text);display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--cyan);color:#04141a;border-color:var(--cyan)}
.btn.green{background:var(--green);color:#041410;border-color:var(--green)}
.btn.red{background:rgba(239,68,68,.12);color:var(--red);border-color:rgba(239,68,68,.45)}
.btn.warn{background:rgba(245,166,35,.12);color:var(--amber);border-color:rgba(245,166,35,.5)}
.btn[disabled]{opacity:.4;pointer-events:none}
.log{max-height:260px;overflow:auto;margin-top:10px;border:1px solid var(--line);border-radius:8px}
table{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:11px;table-layout:fixed}
colgroup col.t{width:26%}
colgroup col.dur{width:12%}
colgroup col.d{width:14%}
colgroup col.m{width:22%}
colgroup col.v{width:26%}
th,td{padding:6px 8px;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
thead th{position:sticky;top:0;background:#0E161D;color:var(--muted);font-weight:600;border-bottom:1px solid var(--line);font-size:10px}
tbody tr{border-bottom:1px solid #17222B}
tbody tr:last-child{border-bottom:none}
tbody tr.alarm td:first-child{color:var(--red);font-weight:700}
tbody tr.alarm{background:rgba(239,68,68,.05)}
.empty{color:var(--muted);text-align:center;padding:22px 10px;font-size:12px}
/* ===== 说明 ===== */
.note{margin-top:14px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px}
.note h3{font-size:13px;margin-bottom:8px}
.note ul{list-style:none}
.note li{font-size:11px;color:var(--muted);line-height:1.7;padding-left:14px;position:relative}
.note li::before{content:"";position:absolute;left:2px;top:8px;width:5px;height:5px;border-radius:50%;background:var(--cyan)}
.note li b{color:var(--text);font-weight:600}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#0B1015;border:1px solid var(--line);color:var(--text);padding:10px 16px;border-radius:9px;font-size:12px;max-width:88vw;box-shadow:0 8px 24px rgba(0,0,0,.5);z-index:50;display:none;font-family:var(--mono)}
.toast.show{display:block}
@media(min-width:560px){
  body{padding:0 0 60px}
  #wrap{max-width:760px;padding:0 20px}
  .grid{grid-template-columns:repeat(3,1fr);gap:14px}
  .gvalue .v{font-size:34px}
}
</style>
</head>
<body>
<div id="wrap">
  <header>
    <div class="brand">
      <div>
        <h1>传感器监测台（权威矫正）</h1>
      </div>
    </div>
    <span class="pill" id="securePill">—</span>
  </header>
  <section class="grid">
    <div class="card">
      <div class="h"><span class="nm">声压级</span><span class="dot" id="dSound"></span></div>
      <div class="gauge"><canvas id="gSound"></canvas></div>
      <div class="gvalue"><span class="v" id="vSound">--</span><span class="u">dB</span></div>
      <div class="gstate" id="sSound">等待麦克风</div>
    </div>
    <div class="card">
      <div class="h"><span class="nm">磁场</span><span class="dot" id="dMag"></span></div>
      <div class="gauge"><canvas id="gMag"></canvas></div>
      <div class="gvalue"><span class="v" id="vMag">--</span><span class="u" id="uMag">方向</span></div>
      <div class="compass-read"><span class="hd">罗盘</span><span id="compass" class="v">--°</span></div>
    </div>
    <div class="card">
      <div class="h"><span class="nm">振动</span><span class="dot" id="dVib"></span></div>
      <div class="gauge"><canvas id="gVib"></canvas></div>
      <div class="gvalue"><span class="v" id="vVib">--.--</span><span class="u">m/s²</span></div>
      <div class="gstate" id="sVib">等待授权</div>
      <div class="vibval">
        <div class="col"><div class="n" id="vibX">--</div><div class="l">X</div></div>
        <div class="col"><div class="n" id="vibY">--</div><div class="l">Y</div></div>
        <div class="col"><div class="n" id="vibZ">--</div><div class="l">Z</div></div>
      </div>
    </div>
  </section>
  <section class="wave">
    <div class="w-h"><span class="nm">实时声波</span><span class="live-db" id="liveDb">-- dB</span></div>
    <canvas id="scope"></canvas>
  </section>
  <section class="zone" id="logZone">
    <div class="z-h">
      <span class="nm">超阈值日志<span id="thrTxt" style="color:var(--amber)">（> 60 约dB）</span></span>
      <span class="cnt" id="logCnt">0 条</span>
    </div>
    <div class="set">
      <label for="thr">报警阈值</label>
      <input type="range" id="thr" min="30" max="100" step="1" value="60">
      <span class="thv" id="thrVal">60</span>
    </div>
    <div class="btns">
      <button class="btn primary" id="btnStart">开始监测</button>
      <button class="btn red" id="btnClear">清空日志</button>
      <button class="btn green" id="btnExport">导出 HTML报告</button>
    </div>
    <div class="log"><table>
      <colgroup>
        <col class="t"><col class="dur"><col class="d"><col class="m"><col class="v">
      </colgroup>
      <thead>
        <tr>
          <th>触发时间</th>
          <th>持续秒</th>
          <th>峰值dB</th>
          <th>磁场</th>
          <th>振动m/s²</th>
        </tr>
      </thead>
      <tbody id="logBody">
        <tr><td colspan="5" class="empty">尚无记录。开始监测后，声压超过阈值持续一段时间会记入日志。</td></tr>
      </tbody>
    </table></div>
  </section>
</div>
<div class="toast" id="toast"></div>
<script>
(function(){
"use strict";
var wakeLockSentinel = null;
var mediaRecorder = null;
var recordedChunks = [];
var micStream = null;

// 请求屏幕常亮
async function acquireWakeLock(){
  if(!("wakeLock" in navigator)){
    toast("当前iOS版本不支持网页常亮，请设置系统自动锁定为「永不」");
    return;
  }
  try{
    wakeLockSentinel = await navigator.wakeLock.request('screen');
    toast("✅已开启屏幕常亮(PWA模式)");
    // 页面失去可见性自动释放锁；回来尝试重新获取
    document.addEventListener('visibilitychange', async ()=>{
      if(wakeLockSentinel !== null && document.visibilityState === 'visible'){
        try{
          wakeLockSentinel = await navigator.wakeLock.request('screen');
        }catch(e){}
      }
    });
  }catch(err){
    toast("⚠️无法获取屏幕常亮："+err.message+"，请将网页【添加到主屏幕】打开");
    wakeLockSentinel=null;
  }
}
// 释放屏幕常亮
async function releaseWakeLock(){
  if(wakeLockSentinel){
    try{await wakeLockSentinel.release();}catch(e){}
    wakeLockSentinel=null;
    toast("已关闭屏幕常亮");
  }
}
var $=function(id){return document.getElementById(id);};
var S={sound:0,mag:0,vib:0};
var DB={value:0};
var CAL=90;
var thr=60;
// ########### 最小记录时长，单位秒，0.2代表大于等于0.2秒就记录短噪声
const MIN_RECORD_SEC = 0.2;
var logArr=[];
var running=false;
var soundLive=false, motionLive=false;
var magMode="compass";
var magSensor=null;
var magX=0, magY=0, magZ=0, magTotalUt=0;

// ========== 超标会话状态机 ==========
var overSession = {
  active: false,
  startTs: 0,
  peakDb: 0,
  magSnap: "",
  vibSnap: 0
};
// 重置会话全部状态
function resetOverSession(){
  overSession.active = false;
  overSession.startTs = 0;
  overSession.peakDb = 0;
  overSession.magSnap = "";
  overSession.vibSnap = 0;
}

// 格式化完整时间：YYYY‑MM‑DD HH:mm:ss
function formatFullTime(timestampMs){
  const d = new Date(timestampMs);
  const y = d.getFullYear();
  const m = ("0"+(d.getMonth()+1)).slice(-2);
  const day = ("0"+d.getDate()).slice(-2);
  const hh = ("0"+d.getHours()).slice(-2);
  const mm = ("0"+d.getMinutes()).slice(-2);
  const ss = ("0"+d.getSeconds()).slice(-2);
  return `${y}-${m}-${day} ${hh}:${mm}:${ss}`;
}

/* ---------- 存储 ---------- */
function loadLog(){
  try{
    var r=JSON.parse(localStorage.getItem("sm_log")||"[]");
    if(Array.isArray(r)) logArr=r;
  }catch(e){logArr=[];}
  renderLog();
}
function saveLog(){
  try{localStorage.setItem("sm_log",JSON.stringify(logArr));}catch(e){
    toast("⚠️本地存储已满，无法保存日志");
  }
}
loadLog();

// 开始录制音频片段（超标会话开启时调用）
function startRecordAudio(){
  if(!micStream) return;
  try{
    recordedChunks = [];
    let options = { mimeType: "audio/webm" };
    if(!MediaRecorder.isTypeSupported(options.mimeType)){
      options = { mimeType: "" };
    }
    mediaRecorder = new MediaRecorder(micStream, options);
    mediaRecorder.ondataavailable = function(e){
      if(e.data.size>0) recordedChunks.push(e.data);
    };
    mediaRecorder.start();
  }catch(err){
    console.warn("录音启动失败",err);
    mediaRecorder = null;
  }
}

// 停止录制，返回base64音频字符串
async function stopRecordAudio(){
  return new Promise((resolve)=>{
    if(!mediaRecorder || mediaRecorder.state==="inactive"){
      resolve(null);
      return;
    }
    mediaRecorder.onstop = async ()=>{
      const blob = new Blob(recordedChunks, {type:"audio/webm"});
      const reader = new FileReader();
      reader.onloadend = ()=>{
        resolve(reader.result);
      };
      reader.readAsDataURL(blob);
    };
    mediaRecorder.stop();
  });
}

/* ---------- 绘制工具 ---------- */
function drawArc(canvas,frac,color){
  var dpr=window.devicePixelRatio||1;
  var w=canvas.clientWidth,h=canvas.clientHeight;
  canvas.width=w*dpr;canvas.height=h*dpr;
  var c=canvas.getContext("2d");
  c.setTransform(dpr,0,0,dpr,0,0);
  var r=Math.min(w,h)/2-6;
  var cx=w/2,cy=h*0.86;
  var a0=Math.PI*0.9,a1=Math.PI*2.1;
  c.clearRect(0,0,w,h);
  c.lineWidth=7;c.lineCap="round";
  c.strokeStyle="#1E2A35";
  c.beginPath();c.arc(cx,cy,r,a0,a1);c.stroke();
  var val=Math.max(0,Math.min(1,frac));
  var ang=a0+(a1-a0)*val;
  var g=c.createLinearGradient(0,0,w,0);
  if(frac>0.95){g.addColorStop(0,"#F5A623");g.addColorStop(1,"#EF4444");}
  else{g.addColorStop(0,color);g.addColorStop(1,"#34D399");}
  c.strokeStyle=g;
  c.beginPath();c.arc(cx,cy,r,a0,ang);c.stroke();
  c.fillStyle="#7B8A99";
  [0,0.5,1].forEach(function(t){
    var a=a0+(a1-a0)*t;
    c.beginPath();c.arc(cx+Math.cos(a)*r,cy+Math.sin(a)*r,1.8,0,6.283);c.fill();
  });
}
function drawScope(){
  var cv=$("scope");var dpr=window.devicePixelRatio||1;
  var w=cv.clientWidth,h=cv.clientHeight;
  cv.width=w*dpr;cv.height=h*dpr;
  var c=cv.getContext("2d");
  c.setTransform(dpr,0,0,dpr,0,0);
  c.fillStyle="#080C10";c.fillRect(0,0,w,h);
  c.strokeStyle="#14202A";c.lineWidth=1;
  var mid=h/2;
  c.beginPath();c.moveTo(0,mid);c.lineTo(w,mid);c.stroke();
  if(!scopeBuf.length){return;}
  c.strokeStyle="#22D3EE";c.lineWidth=1.6;
  c.beginPath();
  var n=scopeBuf.length;
  for(var i=0;i<n;i++){
    var y=mid-scopeBuf[i]*mid*0.9;
    if(i===0)c.moveTo(i*(w/(n-1)),y);else c.lineTo(i*(w/(n-1)),y);
  }
  c.stroke();
}
/* ---------- 麦克风 / 声压 ---------- */
var audioCtx=null,analyser=null,micData=null;
var scopeBuf=[];
function initAudio(){
  if(audioCtx)return Promise.resolve();
  return navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}})
  .then(function(stream){
    micStream = stream;
    audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    var src=audioCtx.createMediaStreamSource(stream);
    analyser=audioCtx.createAnalyser();
    analyser.fftSize=2048;
    // 反应灵敏度：越靠近`0`：**响应极快，灵敏，但是噪声抖动大，读数跳的厉害；`0.35`属于中等平滑
    analyser.smoothingTimeConstant=0.35;
    src.connect(analyser);
    micData=new Uint8Array(analyser.fftSize);
    $("dSound").className="dot live";
    soundLive=true;
    return null;
  });
}
function computeDb(){
  if(!analyser)return;
  analyser.getByteTimeDomainData(micData);
  var sum=0,n=micData.length;
  for(var i=0;i<n;i++){var v=(micData[i]-128)/128;sum+=v*v;}
  var rms=Math.sqrt(sum/n);
  var db=20*Math.log10(rms+1e-6)+CAL;
  if(!isFinite(db)||db<20)db=20;
  DB.value=db;
  S.sound=Math.max(0,Math.min(1,(db-20)/70));
  scopeBuf=[];
  var step=Math.max(1,Math.floor(n/240));
  for(var k=0;k<n;k+=step){scopeBuf.push((micData[k]-128)/128);}
  if(scopeBuf.length>300)scopeBuf=scopeBuf.slice(-300);
}

// 结束当前会话，写入日志（增加音频base64）
async function closeAndSaveSession(){
  if(!overSession.active) return;
  var nowTs=Date.now();
  var durSec = ((nowTs - overSession.startTs)/1000).toFixed(1);
  let audioB64 = await stopRecordAudio();
  if(parseFloat(durSec)>=MIN_RECORD_SEC){
    var waveImgB64 = $("scope").toDataURL("image/png");
    const fullTimeStr = formatFullTime(overSession.startTs);
    logArr.unshift({
      timeText: fullTimeStr,
      timeTs: overSession.startTs,
      durationSec: durSec,
      peakDb: overSession.peakDb.toFixed(1),
      mag: overSession.magSnap,
      vib: overSession.vibSnap.toFixed(2),
      waveImg: waveImgB64,
      audioData: audioB64
    });
    if(logArr.length>300) logArr.length=300;
    saveLog();
    renderLog();
  }
  resetOverSession();
}

// 超标会话处理，每帧执行，使用实时thr
function processOverThreshold(currentDb){
  var nowTs=Date.now();
  var magSnapTxt = magMode==="magnetometer" ? (magTotalUt.toFixed(1)+" µT") : $("compass").textContent;
  if(currentDb > thr){
    // 当前分贝大于实时阈值，维持/开启会话
    if(!overSession.active){
      overSession.active = true;
      overSession.startTs = nowTs;
      overSession.peakDb = currentDb;
      overSession.magSnap = magSnapTxt;
      overSession.vibSnap = vibSmooth;
      startRecordAudio();
    }else{
      if(currentDb > overSession.peakDb) overSession.peakDb = currentDb;
      overSession.vibSnap = vibSmooth;
      overSession.magSnap = magSnapTxt;
    }
  }else{
    // 当前分贝小于实时阈值，关闭会话落盘
    if(overSession.active){
      closeAndSaveSession();
    }
  }
}
function liveDb(){
  if(!running||!soundLive)return;
  computeDb();
  var db=DB.value;
  $("vSound").textContent=db.toFixed(0);
  $("liveDb").textContent=db.toFixed(0)+" dB";
  drawArc($("gSound"),S.sound,db>thr?"#F5A623":"#22D3EE");
  var st=$("sSound");
  if(db>thr){st.textContent="超阈值!";st.className="gstate alarm";}
  else if(db>thr-10){st.textContent="接近阈值";st.className="gstate warn";}
  else{st.textContent="正常";st.className="gstate";}
  drawScope();
  processOverThreshold(db);
}
/* ---------- 振动 ---------- */
var acc={x:0,y:0,z:0};
var vibSmooth=0;
function onMotion(e){
  var a=e.acceleration||{x:0,y:0,z:0};
  acc={x:a.x||0,y:a.y||0,z:a.z||0};
  var mag=Math.sqrt(acc.x*acc.x+acc.y*acc.y+acc.z*acc.z);
  vibSmooth=vibSmooth*0.85+mag*0.15;
  S.vib=Math.max(0,Math.min(1,vibSmooth/12));
  if(!running)return;
  $("vVib").textContent=vibSmooth.toFixed(2);
  $("vibX").textContent=acc.x.toFixed(1);
  $("vibY").textContent=acc.y.toFixed(1);
  $("vibZ").textContent=acc.z.toFixed(1);
  drawArc($("gVib"),S.vib,"#34D399");
  var st=$("sVib");
  if(vibSmooth>4){st.textContent="强烈振动";st.className="gstate alarm";}
  else if(vibSmooth>1.5){st.textContent="振动明显";st.className="gstate warn";}
  else{st.textContent="平稳";st.className="gstate";}
}
function initMotion(){
  if(motionLive)return Promise.resolve();
  var req=window.DeviceMotionEvent&&DeviceMotionEvent.requestPermission?
    DeviceMotionEvent.requestPermission():Promise.resolve("granted");
  return req.then(function(state){
    if(state!=="granted"){throw new Error("motion-denied");}
    window.addEventListener("devicemotion",onMotion,false);
    $("dVib").className="dot live";
    motionLive=true;
    return null;
  });
}
/* ---------- 磁场 / 罗盘 ---------- */
function onOrient(e){
  if(!running)return;
  var head=(typeof e.webkitCompassHeading==="number")?e.webkitCompassHeading:null;
  if(head===null)return;
  $("compass").textContent=Math.round(head)+"°";
  S.mag=head/360;
  drawArc($("gMag"),S.mag,"#A78BFA");
}
function initMagnetometer(){
  if(!("Magnetometer" in window)){
    magMode="compass";
    $("uMag").textContent="方向";
    return;
  }
  magMode="magnetometer";
  try{
    magSensor=new Magnetometer({frequency:20});
    magSensor.addEventListener("reading",function(){
      magX = magSensor.x;
      magY = magSensor.y;
      magZ = magSensor.z;
      magTotalUt = Math.sqrt(magX*magX + magY*magY + magZ*magZ);
      $("uMag").textContent="µT";
      $("vMag").textContent=magTotalUt.toFixed(1);
      $("compass").textContent=Math.round(magX)+","+Math.round(magY)+","+Math.round(magZ);
      S.mag=Math.min(1, magTotalUt / 120);
      drawArc($("gMag"), S.mag,"#A78BFA");
      $("dMag").className="dot live";
    });
    magSensor.addEventListener("error",function(err){
      console.warn("Magnetometer异常，回退罗盘模式",err);
      magMode="compass";
      $("uMag").textContent="方向";
      magSensor=null;
    });
    magSensor.start();
  }catch(err){
    console.warn("初始化Magnetometer失败，回退罗盘",err);
    magMode="compass";
    $("uMag").textContent="方向";
    magSensor=null;
  }
}
function initCompass(){
  if(window.DeviceOrientationEvent&&DeviceOrientationEvent.requestPermission){
    DeviceOrientationEvent.requestPermission().then(function(state){
      if(state==="granted"){
        window.addEventListener("deviceorientation",onOrient,false);
        if(magMode==="compass") $("dMag").className="dot live";
      }
    }).catch(function(){});
  }else if(window.DeviceOrientationEvent){
    window.addEventListener("deviceorientation",onOrient,false);
  }
}
/* ---------- 日志渲染 ---------- */
function renderLog(){
  $("logCnt").textContent=logArr.length+" 条";
  var b=$("logBody");
  if(!logArr.length){
    b.innerHTML='<tr><td colspan="5" class="empty">尚无记录。开始监测后，声压超过阈值持续一段时间会记入日志。</td></tr>';
    return;
  }
  b.innerHTML="";
  for(var i=0;i<logArr.length;i++){
    var r=logArr[i];
    var tr=document.createElement("tr");
    tr.className="alarm";
    tr.innerHTML=
      '<td>'+(r.timeText||"--")+'</td>'+
      '<td>'+(r.durationSec||"N/A")+'s</td>'+
      '<td>'+r.peakDb+'</td>'+
      '<td>'+r.mag+'</td>'+
      '<td>'+r.vib+'</td>';
    b.appendChild(tr);
  }
}

// 导出完整HTML报告（内嵌波形图片base64 + audio播放标签）
function exportHtmlReport(){
  if(!logArr.length){toast("暂无日志可导出");return;}
  var reportTitle="传感器声‑磁‑振监测报告 "+new Date().toLocaleString();
  var tableRows="";
  for(var i=0;i<logArr.length;i++){
    var rec=logArr[i];
    let audioHtml = "";
    if(rec.audioData){
      audioHtml = `<audio controls preload="none" style="height:28px;max-width:240px;"><source src="${rec.audioData}" type="audio/webm">你的浏览器不支持播放该音频`;
    }else{
      audioHtml = `<span style="color:#888">无录音片段</span>`;
    }
    tableRows += `
<tr style="border-bottom:#ccc 1px solid;">
  <td style="padding:6px 8px">${rec.timeText}</td>
  <td style="padding:6px 8px">${rec.durationSec||"N/A"} s</td>
  <td style="padding:6px 8px">${rec.peakDb} dB</td>
  <td style="padding:6px 8px">${rec.mag}</td>
  <td style="padding:6px 8px">${rec.vib} m/s²</td>
  <td style="padding:4px;">${audioHtml}</td>
  <td style="padding:4px;"><img src="${rec.waveImg}" style="width:280px;border:1px solid #666;"></td>
</tr>
`;
  }
  var htmlOut=`<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>${reportTitle}</title>
<style>
body{font-family:system-ui,monospace;padding:16px;background:#f8f8f8;color:#111;}
h2{margin-bottom:12px;}
p{margin:4px 0 12px 0;}
table{border-collapse:collapse;width:100%;font-size:12px;}
th{background:#222;color:#fff;padding:8px;text-align:left;}
td{background:#fff;}
img{max-width:100%;}
audio{vertical-align:middle;}
</style>
</head>
<body>
<h2>${reportTitle}</h2>
<p>当前阈值：>${thr} dB；最小记录时长：${MIN_RECORD_SEC}s；全部数据本地采集，无网络上传</p>
<table>
<thead>
<tr>
<th>触发时间(年‑月‑日 时:分:秒)</th>
<th>持续秒数</th>
<th>峰值dB</th>
<th>磁场</th>
<th>振动m/s²</th>
<th>噪声录音</th>
<th>噪声波形截图</th>
</tr>
</thead>
<tbody>
${tableRows}
</tbody>
</table>
</body>
</html>`;
  var blob=new Blob([htmlOut],{type:"text/html;charset=utf‑8"});
  var a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="传感监测报告_"+new Date().toISOString().slice(0,10)+".html";
  document.body.appendChild(a);
  a.click();
  a.remove();
  toast("已导出HTML报告，"+logArr.length+"条记录，含波形与噪声录音");
}

/* ---------- 主循环 ---------- */
function start(){
  if(running)return;
  acquireWakeLock();
  resetOverSession();
  var init=Promise.resolve()
    .then(initAudio).then(initMotion).then(function(){
      initMagnetometer();
      initCompass();
    });
  init.then(function(){
    running=true;
    $("btnStart").textContent="监测中 · 停止";
    $("btnStart").className="btn red";
    $("thrTxt").textContent="(> "+thr+" 约dB)";
    audioCtx&&audioCtx.resume();
    liveLoop();
  }).catch(function(err){
    toast("启动失败："+(err&&err.message||"请检查 HTTPS 与权限"));
  });
}
async function stop(){
  running=false;
  $("btnStart").textContent="开始监测";
  $("btnStart").className="btn primary";
  if(audioCtx)audioCtx.suspend();
  // 停止监测，如果还有活跃会话立刻落盘保存
  await closeAndSaveSession();
}
function liveLoop(){
  if(!running)return;
  liveDb();
  setTimeout(liveLoop,100);// 采集：20 次 / 秒
}
/* ---------- 事件 ---------- */
$("btnStart").addEventListener("click",async function(){
  if(running){await stop();toast("监测已停止");}else{start();}
});
$("btnClear").addEventListener("click",function(){
  logArr=[];
  resetOverSession();
  saveLog();renderLog();toast("日志已清空");
});
$("btnExport").addEventListener("click",exportHtmlReport);
$("thr").addEventListener("input",function(){
  thr=parseInt(this.value,10);
  $("thrVal").textContent=thr;
  $("thrTxt").textContent="(> "+thr+" dB)";
});
/* ---------- 安全上下文状态 ---------- */
function setSecure(){
  var ok=window.isSecureContext===true;
  var pill=$("securePill");
  if(ok){
    pill.textContent="受信 HTTPS";pill.className="pill on";
  }else{
    pill.textContent="非安全";pill.className="pill";
  }
}
setSecure();
function toast(msg){var t=$("toast");t.textContent=msg;t.className="toast show";clearTimeout(t._h);t._h=setTimeout(function(){t.className="toast";},2600);}
drawArc($("gSound"),0,"#22D3EE");
drawArc($("gMag"),0,"#A78BFA");
drawArc($("gVib"),0,"#34D399");
drawScope();
window.addEventListener("resize",function(){if(running){computeDb();}drawScope();});
})();
</script>
</body>
