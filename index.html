<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name=viewport content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<title>传感器监测台 · 声·磁·振</title>
<link href=css/1.css rel=stylesheet>
</head>
<body>
<div id="wrap">
  <header>
    <div class="brand">
      <div>
        <h1>传感器监测台（权威矫正）</h1>
      </div>
    </div>
  </header>
  <section class="grid">
    <div class="card">
      <div class="h"><span class="nm">声压级</span><span class="dot" id="dSound"></span></div>
      <div class="gauge"><canvas id="gSound"></canvas></div>
      <div class="gvalue"><span class="v" id="vSound">--</span><span class="u">dB</span></div>
      <div class="gstate" id="sSound">等待麦克风</div>
    </div>
    <div class="card">
      <div class="h"><span class="nm">磁场</span><span class="dot" id="dMag"></span></div>
      <div class="gauge"><canvas id="gMag"></canvas></div>
      <div class="gvalue"><span class="v" id="vMag">--</span><span class="u" id="uMag">方向</span></div>
      <div class="compass-read"><span class="hd">罗盘</span><span id="compass" class="v">--°</span></div>
    </div>
    <div class="card">
      <div class="h"><span class="nm">振动</span><span class="dot" id="dVib"></span></div>
      <div class="gauge"><canvas id="gVib"></canvas></div>
      <div class="gvalue"><span class="v" id="vVib">--.--</span><span class="u">m/s²</span></div>
      <div class="gstate" id="sVib">等待授权</div>
      <div class="vibval">
        <div class="col"><div class="n" id="vibX">--</div><div class="l">X</div></div>
        <div class="col"><div class="n" id="vibY">--</div><div class="l">Y</div></div>
        <div class="col"><div class="n" id="vibZ">--</div><div class="l">Z</div></div>
      </div>
    </div>
  </section>
  <section class="wave">
    <div class="w-h"><span class="nm">实时声波</span><span class="live-db" id="liveDb">-- dB</span></div>
    <canvas id="scope"></canvas>
  </section>
  <section class="zone" id="logZone">
    <div class="z-h"><span class="cnt">法定《噪声污染防治法》扰民噪声：白天(>=6点 <22点) > 55 dB(A)；夜间 > 45 dB(A);日志：<span>
      <span class="cnt" id="logCnt">0 条</span>
    </div>
    
    <div class="btns">
      <button class="btn primary" id="btnStart">开始监测</button>
      <button class="btn red" id="btnClear">清空日志</button>
      <button class="btn green" id="btnExport">导出 HTML报告</button>
    </div>
    <div class="log"><table>
      <colgroup>
        <col class="t"><col class="dur"><col class="d"><col class="m"><col class="v">
      </colgroup>
      <thead>
        <tr>
          <th>触发时间</th>
          <th>持续秒</th>
          <th>峰值dB</th>
          <th>纬度</th>
          <th>经度</th>
        </tr>
      </thead>
      <tbody id="logBody">
        <tr><td colspan="5" class="empty">尚无记录。开始监测后，声压超过阈值持续一段时间会记入日志。</td></tr>
      </tbody>
    </table></div>
  </section>
</div>
<div class="toast" id="toast"></div>
<script src=js/1.js></script>
</body>
</html>
